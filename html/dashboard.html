/* =========================================================
   SIGNED-IN USER LOOKUP
   Unchanged in behaviour: checks the usual key names across
   localStorage then sessionStorage, accepts a JSON object or
   a bare address, digs into nested objects, and finally
   sweeps every key for something that looks like an address.
   ========================================================= */
const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
const USER_KEY_CANDIDATES = [
  'user', 'currentUser', 'loggedInUser', 'authUser', 'stacklyUser', 'agritechUser',
  'userData', 'profile', 'account', 'auth', 'session',
  'userEmail', 'email', 'username'
];
const EMAIL_FIELDS = ['email', 'mail', 'useremail', 'emailaddress', 'e-mail', 'username', 'login', 'user'];
const NAME_FIELDS = ['name', 'fullname', 'displayname', 'firstname', 'givenname'];
let foundUserKey = null;

function asEmail(v) {
  if (typeof v !== 'string') return null;
  const s = v.trim();
  return EMAIL_RE.test(s) ? s : null;
}
function objToUser(obj, depth) {
  depth = depth || 0;
  if (!obj || depth > 4) return null;
  if (typeof obj === 'string') {
    const direct = asEmail(obj);
    if (direct) return { email: direct };
    return rawToUser(obj, depth + 1);
  }
  if (Array.isArray(obj)) {
    for (let i = 0; i < obj.length; i++) {
      const hit = objToUser(obj[i], depth + 1);
      if (hit) return hit;
    }
    return null;
  }
  if (typeof obj !== 'object') return null;
  for (const k in obj) {
    if (EMAIL_FIELDS.indexOf(String(k).toLowerCase()) === -1) continue;
    const hit = asEmail(obj[k]);
    if (hit) return Object.assign({}, obj, { email: hit });
  }
  for (const k in obj) {
    const hit = asEmail(obj[k]);
    if (hit) return Object.assign({}, obj, { email: hit });
  }
  for (const k in obj) {
    const v = obj[k];
    if (v && typeof v === 'object') {
      const nested = objToUser(v, depth + 1);
      if (nested) return nested;
    } else if (typeof v === 'string' && (v.trim().charAt(0) === '{' || v.trim().charAt(0) === '[')) {
      const nested = rawToUser(v, depth + 1);
      if (nested) return nested;
    }
  }
  return null;
}
function rawToUser(raw, depth) {
  depth = depth || 0;
  if (!raw || depth > 4) return null;
  const trimmed = String(raw).trim();
  if (!trimmed) return null;
  const first = trimmed.charAt(0);
  if (first === '{' || first === '[' || first === '"') {
    try { return objToUser(JSON.parse(trimmed), depth); } catch (e) {}
  }
  const direct = asEmail(trimmed);
  if (direct) return { email: direct };
  try { return objToUser(JSON.parse(trimmed), depth); } catch (e) { return null; }
}
function pickName(obj) {
  if (!obj || typeof obj !== 'object') return '';
  for (const k in obj) {
    if (NAME_FIELDS.indexOf(String(k).toLowerCase()) === -1) continue;
    const v = obj[k];
    if (typeof v === 'string' && v.trim() && !asEmail(v)) return v.trim();
  }
  return '';
}
function getCurrentUser() {
  const stores = [];
  try { if (window.localStorage) stores.push(localStorage); } catch (e) {}
  try { if (window.sessionStorage) stores.push(sessionStorage); } catch (e) {}
  for (let s = 0; s < stores.length; s++) {
    try { if (stores[s].getItem('isAuthenticated') === 'false') return null; } catch (e) {}
  }
  for (let s = 0; s < stores.length; s++) {
    for (let i = 0; i < USER_KEY_CANDIDATES.length; i++) {
      const key = USER_KEY_CANDIDATES[i];
      let hit = null;
      try { hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
      if (hit) { foundUserKey = key; return hit; }
    }
  }
  for (let s = 0; s < stores.length; s++) {
    let len = 0;
    try { len = stores[s].length; } catch (e) {}
    for (let i = 0; i < len; i++) {
      let key = null, hit = null;
      try { key = stores[s].key(i); hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
      if (hit) { foundUserKey = key; return hit; }
    }
  }
  return null;
}
function usernameFromEmail(email) { if (!email) return ''; return email.includes('@') ? email.split('@')[0] : email; }

const currentUser = getCurrentUser();
const currentEmail = currentUser ? (asEmail(currentUser.email) || '') : '';
const storedName = currentUser ? pickName(currentUser) : '';
const currentUsername = currentEmail || storedName ? (storedName || usernameFromEmail(currentEmail)) : '';
const currentInitial = ((currentEmail || currentUsername || '?').trim().charAt(0) || '?').toUpperCase();

function paintUserChrome() {
  const nameToShow = currentUsername || currentEmail || 'Signed out';
  const emailToShow = currentEmail || '—';
  document.getElementById('sidebar-user-avatar').textContent = currentInitial;
  document.getElementById('sidebar-user-name').textContent = nameToShow;
  document.getElementById('sidebar-user-name').setAttribute('title', nameToShow);
  document.getElementById('sidebar-user-email').textContent = emailToShow;
  document.getElementById('sidebar-user-email').setAttribute('title', emailToShow);
  document.getElementById('topbar-user-avatar').textContent = currentInitial;
  document.getElementById('topbar-user-name').textContent = nameToShow;
  document.getElementById('topbar-user-email').textContent = emailToShow;
}

function logout() {
  const keys = ['user', 'isAuthenticated', 'activeNav', 'settings'].concat(USER_KEY_CANDIDATES);
  if (foundUserKey && keys.indexOf(foundUserKey) === -1) keys.push(foundUserKey);
  keys.forEach(function (k) {
    try { localStorage.removeItem(k); } catch (e) {}
    try { sessionStorage.removeItem(k); } catch (e) {}
  });
  window.location.href = 'login.html';
}

function getSavedNav() {
  try { const saved = localStorage.getItem('activeNav'); if (saved && pageMap[saved]) return saved; } catch (e) {}
  return 'dashboard';
}
function loadSettings() {
  const defaults = { hearingAlerts: true, weeklyDigest: false, compactRows: false, language: "English" };
  try { const raw = localStorage.getItem('settings'); if (raw) return Object.assign(defaults, JSON.parse(raw)); } catch (e) {}
  return defaults;
}
function saveSettings() { try { localStorage.setItem('settings', JSON.stringify(state.settings)); } catch (e) {} }

function money(n) { return "$" + n.toLocaleString(); }
function go404() { window.location.href = "404.html"; }
function areaTag(area) {
  const c = areaAccents[area] || "#5fd48a";
  return `<span class="area-tag" style="color:${c};border-color:${c}55;background:${c}18;">${area}</span>`;
}

function fillBars() {
  requestAnimationFrame(function () {
    document.querySelectorAll('[data-w]').forEach(function (el) {
      el.style.width = el.getAttribute('data-w') + '%';
    });
  });
}

function entrance() {
  if (typeof gsap === 'undefined') return;
  gsap.killTweensOf('.figure, .panel, .listing, .counsel-card, .precedent-card');
  gsap.fromTo('.figure', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.06 });
  gsap.fromTo('.panel', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.06, delay: 0.06 });
  gsap.fromTo('.panel-rule', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'expo.out', stagger: 0.06, delay: 0.1 });
  gsap.fromTo('.listing, .counsel-card, .precedent-card, .runs-table tbody tr',
    { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out', stagger: 0.025, delay: 0.15 });

  document.querySelectorAll('.figure-value').forEach(function (el) {
    const raw = el.textContent.trim();
    const match = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
    if (!match) return;
    const prefix = match[1], numStr = match[2].replace(/,/g, ''), suffix = match[3];
    const num = parseFloat(numStr);
    if (isNaN(num)) return;
    const isInt = Number.isInteger(num) && numStr.indexOf('.') === -1;
    const counter = { val: 0 };
    gsap.to(counter, {
      val: num, duration: 1.1, ease: 'power2.out', delay: 0.1,
      onUpdate: function () {
        const shown = isInt ? Math.round(counter.val).toLocaleString() : counter.val.toFixed(1);
        el.textContent = prefix + shown + suffix;
      },
      onComplete: function () { el.textContent = raw; }
    });
  });
}

/* =========================================================
   TASKS
   The search reads every column — reference, task, block,
   operation, type, due date, priority and status — and each
   word typed has to match somewhere, so "high irrigation"
   narrows rather than widens.
   ========================================================= */
function deadlineMatches(d, terms) {
  if (!terms.length) return true;
  const hay = [d.id, d.task, d.matter, d.area, d.type, d.due, d.priority, d.status]
    .join(" ").toLowerCase();
  return terms.every(function (t) { return hay.indexOf(t) > -1; });
}

function renderDeadlines() {
  const terms = state.deadlineSearch.toLowerCase().split(/\s+/).filter(Boolean);
  const list = deadlines.filter(function (d) { return deadlineMatches(d, terms); });

    { label: "Missed",              value: "0",   note: "clean record",       bar: 4,  icon: "sun" }
  ]);

  const sub = terms.length

  const rows = list.map(function (d) {
    return `<tr onclick="go404()">

  return `${band}

  dashboard: renderDashboard, matters: renderMatters, counsel: renderCounsel,
  deadlines: renderDeadlines, memos: renderMemos, diary: renderDiary,
  billing: renderBilling, precedents: renderPrecedents, settings: renderSettings
};

/* =========================================================
   SHELL
   ========================================================= */
function renderNav() {
  const main = navItems.slice(0, 6);
  const mgmt = navItems.slice(6);
  function itemHtml(item) {
    const badge = item.id === "deadlines" ? `<span class="rail-badge">14</span>`
                : item.id === "matters"   ? `<span class="rail-badge">8</span>` : "";
    return `<button class="rail-item ${state.activeNav === item.id ? 'on' : ''}" data-nav="${item.id}">${ico(item.icon, 'rail-ico')}<span>${item.label}</span>${badge}</button>`;
  }
  document.getElementById("nav-main").innerHTML = main.map(itemHtml).join("");
  document.getElementById("nav-management").innerHTML = mgmt.map(itemHtml).join("");
}

function renderPage() {
  const page = pageMap[state.activeNav];
  document.getElementById("page-title-text").textContent = page.title;
  document.getElementById("page-sub-text").textContent = page.sub;
  document.getElementById("content-area").innerHTML = pageRenderers[state.activeNav]();
  document.body.classList.toggle('compact', !!state.settings.compactRows);
  renderNav();
  const settingsLogoutBtn = document.getElementById("settings-logout-btn");
  if (settingsLogoutBtn) settingsLogoutBtn.addEventListener("click", logout);
  window.scrollTo({ top: 0, left: 0, behavior: "instant" });
  fillBars();
  entrance();
}

function navigateTo(id) {
  state.activeNav = id;
  try { localStorage.setItem('activeNav', id); } catch (e) {}
  closeRail();
  closeWhoami();
  renderPage();
}

/* ---- rail open / close with page-scroll lock ---- */
let savedScrollY = 0;
function lockScroll() {
  savedScrollY = window.scrollY || window.pageYOffset || 0;
  document.documentElement.classList.add("nav-open");
  document.body.classList.add("nav-open");
}
function unlockScroll() {
  if (!document.body.classList.contains("nav-open")) return;
  document.documentElement.classList.remove("nav-open");
  document.body.classList.remove("nav-open");
  window.scrollTo(0, savedScrollY);
}
function openRail() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-overlay").classList.add("show");
  lockScroll();
}
function closeRail() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("show");
  unlockScroll();
}
function closeWhoami() { document.getElementById("topbar-user").classList.remove("open"); }

document.getElementById("hamburger-btn").addEventListener("click", openRail);
document.getElementById("close-sidebar-btn").addEventListener("click", closeRail);
document.getElementById("brand-home-btn").addEventListener("click", function () { navigateTo("dashboard"); });
document.getElementById("sidebar-overlay").addEventListener("click", closeRail);
document.getElementById("notif-btn").addEventListener("click", go404);
document.getElementById("logout-btn").addEventListener("click", logout);
document.getElementById("topbar-logout-btn").addEventListener("click", logout);
document.getElementById("topbar-user-btn").addEventListener("click", function (e) {
  e.stopPropagation();
  document.getElementById("topbar-user").classList.toggle("open");
});
document.addEventListener("click", closeWhoami);
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeRail(); closeWhoami(); } });
window.addEventListener("resize", function () { if (window.innerWidth > 1040) closeRail(); });

/* ---- topbar search: anything typed, then Enter or the
        magnifier, opens the results page ---- */
(function () {
  const form = document.getElementById("topbar-search");
  const input = document.getElementById("topbar-search-input");
  if (!form || !input) return;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!input.value.trim()) { input.focus(); return; }
    go404();
  });
})();

document.addEventListener("click", function (e) {
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
  const filterBtn = e.target.closest(".matter-filter");
  if (filterBtn) { state.matterFilter = filterBtn.getAttribute("data-filter"); renderPage(); return; }
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) {
    const key = toggle.getAttribute("data-toggle");
    state.settings[key] = !state.settings[key];
    saveSettings();
    toggle.classList.toggle("on", state.settings[key]);
    toggle.setAttribute("aria-checked", String(state.settings[key]));
    if (key === "compactRows") document.body.classList.toggle("compact", state.settings[key]);
    if (typeof gsap !== 'undefined') {
      gsap.fromTo(toggle.querySelector('.switch-knob'), { scale: 0.7 }, { scale: 1, duration: 0.3, ease: 'back.out(3)' });
    }
    return;
  }
});

document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "product-search-input") {
    state.deadlineSearch = e.target.value;
    const caretPos = e.target.selectionStart;
    renderPage();
    const input = document.getElementById("product-search-input");
    if (input) { input.focus(); input.setSelectionRange(caretPos, caretPos); }
  }
});

document.addEventListener("change", function (e) {
  if (e.target && e.target.id === "lang-select") { state.settings.language = e.target.value; saveSettings(); }
});

paintUserChrome();
if (typeof gsap !== 'undefined') {
  gsap.from('#topbar', { y: -14, opacity: 0, duration: 0.5, ease: 'power2.out' });
  // The rail only slides in where it is a fixed column. Below that it is an
  // off-canvas drawer driven by a CSS transform, so an inline transform from
  // GSAP would fight the .open class — fade it instead and clear up after.
  if (window.innerWidth > 1040) {
    gsap.from('.rail', { x: -18, opacity: 0, duration: 0.6, ease: 'power3.out', clearProps: 'transform' });
  } else {
    gsap.from('.rail', { opacity: 0, duration: 0.4, ease: 'power2.out' });
  }
}
renderPage();
</script>
</body>
</html>
